<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#08080a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Capture" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Rudder Capture</title>
<!--
  Thin phone client for Rudder Capture. Single file, zero dependencies.
  Served same-origin by Rudder at /m.html, so it POSTs to /api/ingest with no
  CORS and (on your LAN) no token. Mirrors the Session contract + SESSION_KINDS
  in app/src/lib/sessionKinds.ts — keep the KINDS list below in sync.

  Note on audio: browsers only allow mic access in a secure context (HTTPS or
  localhost). Over plain LAN http:// the typed session works everywhere; audio
  unlocks when Rudder is reached over HTTPS (e.g. Tailscale Serve, or
  `next dev --experimental-https`). The UI detects this and adapts.
-->
<style>
  :root{
    --bg:#08080a; --surface:#101013; --surface2:#17171b; --border:#232327;
    --text:#f5f5f6; --muted:#a8a8b2; --dim:#56565f;
    --accent:#34d399; --accent-deep:#10b981; --danger:#f87171;
    --r:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .app{max-width:560px;margin:0 auto;padding:18px 16px 28px;min-height:100%;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#04130c;
    background:linear-gradient(135deg,#6ee7b7,#34d399 45%,#10b981);box-shadow:0 0 18px -4px rgba(52,211,153,.4)}
  h1{font-size:17px;margin:0;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:12.5px;margin:2px 0 16px}
  .gear{margin-left:auto;background:none;border:none;color:var(--dim);font-size:20px;padding:6px}
  /* kind grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:16px 14px;text-align:left;color:var(--text);min-height:92px;display:flex;flex-direction:column;gap:8px;
    transition:transform .12s, border-color .12s}
  .tile:active{transform:scale(.97);border-color:var(--accent)}
  .tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:rgba(52,211,153,.1);color:var(--accent);font-size:18px}
  .tile .lb{font-weight:600;font-size:15px}
  .tile .ht{font-size:11.5px;color:var(--dim)}
  /* panels */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-top:6px}
  .center{text-align:center}
  .timer{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--danger);
    box-shadow:0 0 12px rgba(248,113,113,.7);margin-right:9px;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:11px;
    color:var(--text);font-size:16px;padding:12px 13px;outline:none;font-family:inherit}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:64px}
  .badge{display:inline-block;background:rgba(52,211,153,.1);color:var(--accent);border:1px solid rgba(52,211,153,.2);
    border-radius:8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px}
  /* buttons */
  .btn{width:100%;border:none;border-radius:13px;font-size:16px;font-weight:600;padding:16px;margin-top:16px;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,#6ee7b7,#34d399 45%,#10b981);color:#04130c}
  .btn-stop{background:var(--danger);color:#190606}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .row{display:flex;gap:10px}
  .row .btn{margin-top:0}
  .note{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.5}
  .warn{color:#fbbf24}
  .ok-ic{width:54px;height:54px;border-radius:50%;display:inline-grid;place-items:center;font-size:26px;
    background:rgba(52,211,153,.12);color:var(--accent)}
  .err-ic{width:54px;height:54px;border-radius:50%;display:inline-grid;place-items:center;font-size:26px;
    background:rgba(248,113,113,.12);color:var(--danger)}
  .back{background:none;border:none;color:var(--muted);font-size:14px;padding:8px 0;margin-bottom:4px}
  .hidden{display:none}
  audio{width:100%;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">R</div>
    <div>
      <h1>Capture a session</h1>
    </div>
    <button class="gear" id="gear" aria-label="Settings">⚙︎</button>
  </header>
  <div class="sub" id="sub">Pick a type, record or type, send it to your brain.</div>

  <!-- settings -->
  <div id="settings" class="panel hidden">
    <label>Rudder server <span style="text-transform:none;color:var(--dim)">(blank = this site)</span></label>
    <input id="server" placeholder="http://your-mac.local:3000" inputmode="url" autocapitalize="off" />
    <label>Ingest token <span style="text-transform:none;color:var(--dim)">(only if you set RUDDER_INGEST_TOKEN)</span></label>
    <input id="token" placeholder="optional" autocapitalize="off" />
    <button class="btn btn-primary" id="saveSettings">Save</button>
    <div class="note" id="ctxNote"></div>
  </div>

  <!-- stage: kinds -->
  <div id="stage-kinds">
    <div class="grid" id="kindGrid"></div>
  </div>

  <!-- stage: recording -->
  <div id="stage-rec" class="hidden">
    <button class="back" id="recBack">‹ Start over</button>
    <div class="panel center">
      <div class="badge" id="recKind">Meeting</div>
      <div style="margin:18px 0 10px"><span class="recdot" id="recDot"></span><span class="timer" id="timer">0:00</span></div>
      <div class="note" id="recHint">Recording… speak freely.</div>
      <button class="btn btn-stop" id="stopBtn">■ Stop session</button>
    </div>
  </div>

  <!-- stage: review -->
  <div id="stage-review" class="hidden">
    <button class="back" id="revBack">‹ Start over</button>
    <div class="panel">
      <div><span class="badge" id="revKind">Meeting</span> <span class="note" id="revMeta" style="margin:0"></span></div>
      <audio id="player" class="hidden" controls></audio>
      <label>Title <span style="text-transform:none;color:var(--dim)">(optional)</span></label>
      <input id="title" placeholder="What was it about?" />
      <div id="peopleWrap">
        <label>Who was there? <span style="text-transform:none;color:var(--dim)">(comma-separated)</span></label>
        <input id="people" placeholder="Jordan Lee, Alex Rivera" autocapitalize="words" />
      </div>
      <label id="noteLabel">Add a note <span style="text-transform:none;color:var(--dim)">(optional)</span></label>
      <textarea id="note" placeholder="Anything to pair with the transcript…"></textarea>
      <div class="row" style="margin-top:16px">
        <button class="btn btn-ghost" id="discardBtn">Discard</button>
        <button class="btn btn-primary" id="sendBtn">Send to brain ›</button>
      </div>
    </div>
  </div>

  <!-- stage: result -->
  <div id="stage-done" class="hidden">
    <div class="panel center">
      <div id="doneIcon"></div>
      <div id="doneTitle" style="font-weight:600;margin-top:12px"></div>
      <div class="note" id="doneMsg"></div>
      <button class="btn btn-primary" id="againBtn">Capture another</button>
    </div>
  </div>
</div>

<script>
// ── SESSION_KINDS (mirror of app/src/lib/sessionKinds.ts) ──
const KINDS = [
  {id:"meeting",label:"Meeting",icon:"👥",people:true,priv:"normal",hint:"Group sync"},
  {id:"call",label:"1:1 / Call",icon:"📞",people:true,priv:"normal",hint:"Phone or video"},
  {id:"conversation",label:"Conversation",icon:"💬",people:true,priv:"normal",hint:"In-person"},
  {id:"interview",label:"Interview",icon:"🎙️",people:true,priv:"normal",long:true},
  {id:"idea",label:"Idea",icon:"💡",people:false,priv:"private",hint:"Quick memo"},
  {id:"brainstorm",label:"Brainstorm",icon:"🧠",people:false,priv:"private"},
  {id:"journal",label:"Journal",icon:"📓",people:false,priv:"private",hint:"Private"},
  {id:"lecture",label:"Lecture",icon:"🎓",people:false,priv:"normal",long:true},
  {id:"study",label:"Study",icon:"📑",people:false,priv:"normal"},
  {id:"appointment",label:"Appointment",icon:"📅",people:false,priv:"private"},
  {id:"errand",label:"Errand",icon:"📍",people:false,priv:"normal"},
  {id:"family",label:"Family",icon:"❤️",people:true,priv:"private"},
  {id:"other",label:"Other",icon:"●",people:false,priv:"normal"},
];

const $ = s => document.querySelector(s);
const LS = window.localStorage;
const state = { kind:null, seconds:0, timer:null, rec:null, stream:null, chunks:[], blob:null };
const secure = window.isSecureContext; // mic needs this

function api(path){ const base=(LS.getItem("rudder_server")||"").replace(/\/$/,""); return base+path; }
function authHeaders(h={}){ const t=LS.getItem("rudder_token"); if(t) h["x-ingest-token"]=t; return h; }

// ── build kind grid ──
const grid = $("#kindGrid");
KINDS.forEach(k=>{
  const b=document.createElement("button");
  b.className="tile";
  b.innerHTML=`<span class="ic">${k.icon}</span><span class="lb">${k.label}</span>`+(k.hint?`<span class="ht">${k.hint}</span>`:"");
  b.onclick=()=>start(k);
  grid.appendChild(b);
});

function show(id){ ["kinds","rec","review","done"].forEach(s=>$("#stage-"+s).classList.toggle("hidden", s!==id)); }
function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

async function start(k){
  state.kind=k; state.seconds=0; state.blob=null; state.chunks=[];
  $("#recKind").textContent=k.label;
  $("#timer").textContent="0:00";
  show("rec");
  if(secure && navigator.mediaDevices?.getUserMedia){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      state.stream=stream;
      const rec=new MediaRecorder(stream);
      rec.ondataavailable=e=>{ if(e.data.size>0) state.chunks.push(e.data); };
      rec.onstop=()=>{ state.blob=new Blob(state.chunks,{type:rec.mimeType||"audio/webm"}); };
      rec.start(); state.rec=rec;
      $("#recDot").style.display=""; $("#recHint").textContent="Recording… speak freely.";
    }catch(e){
      $("#recDot").style.display="none";
      $("#recHint").innerHTML='<span class="warn">No mic access — you can type the session.</span>';
    }
  } else {
    $("#recDot").style.display="none";
    $("#recHint").innerHTML='<span class="warn">Audio needs HTTPS. Type the session below, or serve Rudder over HTTPS (see ⚙︎).</span>';
  }
  state.timer=setInterval(()=>{ state.seconds++; $("#timer").textContent=fmt(state.seconds); },1000);
}

function stop(){
  clearInterval(state.timer);
  try{ if(state.rec && state.rec.state!=="inactive") state.rec.stop(); }catch(e){}
  if(state.stream) state.stream.getTracks().forEach(t=>t.stop());
  const k=state.kind;
  $("#revKind").textContent=k.label;
  $("#revMeta").textContent=fmt(state.seconds)+" · "+new Date().toLocaleDateString();
  $("#peopleWrap").style.display=k.people?"":"none";
  // wait a tick for onstop to populate blob
  setTimeout(()=>{
    const p=$("#player");
    if(state.blob){ p.src=URL.createObjectURL(state.blob); p.classList.remove("hidden");
      $("#noteLabel").innerHTML='Add a note <span style="text-transform:none;color:var(--dim)">(optional)</span>';
      $("#note").placeholder="Anything to pair with the transcript…";
    } else { p.classList.add("hidden");
      $("#noteLabel").innerHTML='What happened? <span style="text-transform:none;color:var(--dim)">(no audio — type it)</span>';
      $("#note").placeholder="Describe the session so the brain can recall it…";
    }
  },120);
  show("review");
}

async function send(){
  const k=state.kind;
  const people=$("#people").value.split(",").map(s=>s.trim()).filter(Boolean);
  const title=$("#title").value.trim();
  const note=$("#note").value.trim();
  const date=new Date().toISOString().slice(0,10);
  $("#sendBtn").textContent="Sending…"; $("#sendBtn").disabled=true;
  try{
    let res;
    if(state.blob && state.blob.size>0){
      const fd=new FormData();
      const ext=(state.blob.type.split("/")[1]||"webm").split(";")[0];
      fd.append("audio",state.blob,"session."+ext);
      fd.append("source","phone"); fd.append("kind",k.label); fd.append("date",date);
      if(title) fd.append("title",title);
      if(people.length) fd.append("people",JSON.stringify(people));
      res=await fetch(api("/api/ingest"),{method:"POST",headers:authHeaders(),body:fd});
    } else {
      res=await fetch(api("/api/ingest"),{method:"POST",
        headers:authHeaders({"content-type":"application/json"}),
        body:JSON.stringify({source:"phone",kind:k.label,title:title||undefined,
          people:people.length?people:undefined,date,text:note||k.label+" session"})});
    }
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||("HTTP "+res.status));
    done(true,"Session captured","Saved to memory — "+(data.indexed??data.chunks??0)+" chunk(s) indexed.");
  }catch(e){
    done(false,"Couldn’t save",e.message+(/Failed to fetch/i.test(e.message)?" — check the server address in ⚙︎ and that you’re on the same network.":""));
  }
  $("#sendBtn").textContent="Send to brain ›"; $("#sendBtn").disabled=false;
}

function done(ok,title,msg){
  $("#doneIcon").innerHTML = ok?'<span class="ok-ic">✓</span>':'<span class="err-ic">✕</span>';
  $("#doneTitle").textContent=title; $("#doneMsg").textContent=msg;
  show("done");
}
function reset(){ show("kinds"); $("#title").value=""; $("#people").value=""; $("#note").value=""; }

// ── wire up ──
$("#stopBtn").onclick=stop;
$("#sendBtn").onclick=send;
$("#discardBtn").onclick=reset;
$("#recBack").onclick=reset;
$("#revBack").onclick=reset;
$("#againBtn").onclick=reset;
// settings
$("#server").value=LS.getItem("rudder_server")||"";
$("#token").value=LS.getItem("rudder_token")||"";
$("#ctxNote").innerHTML = secure
  ? 'Secure context ✓ — audio recording is available.'
  : '<span class="warn">Not a secure context</span> — phone audio needs HTTPS. Easiest: Tailscale Serve (5-min setup in <b>docs/phone-https.md</b>). Typed sessions work right now.';
$("#gear").onclick=()=>$("#settings").classList.toggle("hidden");
$("#saveSettings").onclick=()=>{
  LS.setItem("rudder_server",$("#server").value.trim());
  LS.setItem("rudder_token",$("#token").value.trim());
  $("#settings").classList.add("hidden");
};
</script>
</body>
</html>

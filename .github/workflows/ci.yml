name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Lint, Test, Type-check and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      # The codebase is lint-clean (zero errors/warnings); keep it that way by
      # failing the build on any new lint problem.
      - name: Lint
        run: |
          cd app
          npm run lint

      - name: Unit Tests
        run: |
          cd app
          npm test

      - name: TypeScript Type-check
        run: |
          cd app
          npx tsc --noEmit

      - name: Next.js Production Build
        run: |
          cd app
          npm run build
